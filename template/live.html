{% extends 'masjed_base.html' %}
{% load static %}

{% block title %}
    پخش زنده_مسجد جامع امام جامع امام سجاد(ع)
{% endblock %}


{% block body-class %}
    live-body-page
{% endblock %}

{% block content %}

    <!-- live -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10">
                    <div class="shadow p-3 bg-white rounded-3">

                        <!-- Embed Aparat Live -->
                        <div class="h_iframe-aparat_embed_frame ratio ratio-16x9">
                            <style>
                                .h_iframe-aparat_embed_frame {
                                    position: relative;
                                }

                                .h_iframe-aparat_embed_frame iframe {
                                    position: absolute;
                                    top: 0;
                                    left: 0;
                                    width: 100%;
                                    height: 100%;
                                }

                                .aparat-btn {
                                    display: block;
                                    width: 100%;
                                    background: #ed1b4c;
                                    color: #fff;
                                    text-decoration: none;
                                    padding: 14px 20px;
                                    border-radius: 12px;
                                    font-weight: 700;
                                    text-align: center;
                                    transition: .3s;
                                }

                                .aparat-btn:hover {
                                    background: #d91543;
                                    color: #fff;
                                }
                            </style>

                            <span style="display: block;padding-top: 56.25%;"></span>

                            <iframe
                                    scrolling="no"
                                    allowFullScreen="true"
                                    webkitallowfullscreen="true"
                                    mozallowfullscreen="true"
                                    src="https://www.aparat.com/embed/live/mjes.ir">
                            </iframe>
                        </div>

                        <div class="text-center mt-4">
                            <a href="https://www.aparat.com/mjes.ir/live"
                               target="_blank"
                               class="aparat-btn">
                                مشاهده مستقیم از وب سایت آپارات
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>

{% endblock %}
